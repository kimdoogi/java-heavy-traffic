global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: coupon-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["coupon-api:8080"]
  - job_name: mock-external
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mock-external:8081"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
