spring:
  application:
    name: coupon-api
  threads:
    virtual:
      enabled: ${VT:true}            # 핵심 실험 변수: true=버츄얼 쓰레드, false=플랫폼 쓰레드(Tomcat 풀)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coupon}
    username: ${DB_USER:coupon}
    password: ${DB_PASSWORD:coupon}
    hikari:
      maximum-pool-size: ${POOL_SIZE:20}   # 실험 변수 (E4)
      minimum-idle: ${POOL_SIZE:20}
      connection-timeout: ${POOL_CONN_TIMEOUT_MS:3000}
      pool-name: coupon-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # E8 저항성: 명령/연결 응답 상한. 없으면 Lettuce 기본(명령 60s)이라 hung Redis에서 무한 대기 → 커넥션 큐 적체.
      # Hikari 3s·external 1s와 정렬. Redis 순수 지연은 <100ms이라 1s면 정상 부하 여유 + 60s hang을 1s로 단축.
      timeout: ${REDIS_TIMEOUT_MS:1000}ms
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:1000}ms
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}        # VT=false 일 때만 의미 있음 (플랫폼 쓰레드 풀 크기)
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}
    mbeanregistry:
      enabled: true                         # tomcat_threads_* 메트릭 노출

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,threaddump,env
  endpoint:
    health:
      show-details: always
    env:
      show-values: always      # 로컬 실험 스택 한정 — 실효 설정 스냅샷·검증용 (유일한 비밀번호는 로컬 coupon/coupon)
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true          # p50/p95/p99를 Prometheus에서 histogram_quantile로 계산
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s

coupon:
  issue:
    strategy: ${ISSUE_STRATEGY:redis}   # none | db-pessimistic | db-optimistic | redis (E6 실험 변수, PLAN §1.3)
    optimistic-max-retries: ${OPTIMISTIC_MAX_RETRIES:3}   # db-optimistic 전략의 version 충돌 재시도 상한
  idempotency:
    lock-ttl-seconds: ${IDEMPOTENCY_LOCK_TTL_SECONDS:30}     # 클레임(PROCESSING) 유지 상한 — 이 안에 액션이 끝나야 함 (E7)
    result-ttl-seconds: ${IDEMPOTENCY_RESULT_TTL_SECONDS:600} # 캐시된 응답 재생 가능 기간
  redis:
    cb:                                                        # Redis 접근 서킷브레이커 (E8) — slow/실패 시 OPEN → 즉시 503
      sliding-window-size: ${REDIS_CB_WINDOW:50}
      minimum-calls: ${REDIS_CB_MIN_CALLS:20}                 # 이 수만큼 쌓여야 비율 평가 시작 (window 이하)
      failure-rate-threshold: ${REDIS_CB_FAILURE_RATE:50}     # 실패(timeout·단절) 비율 % 임계
      slow-call-rate-threshold: ${REDIS_CB_SLOW_RATE:50}      # 느린-성공 비율 % 임계
      slow-call-duration-ms: ${REDIS_CB_SLOW_MS:300}          # 이 시간 초과 호출 = slow (정상<50ms, 저하~400ms)
      wait-in-open-ms: ${REDIS_CB_WAIT_OPEN_MS:5000}          # OPEN 유지 후 half-open 회복 탐색
      permitted-in-half-open: ${REDIS_CB_HALF_OPEN:5}

external:
  base-url: ${EXTERNAL_BASE_URL:http://localhost:8081}
  connect-timeout-ms: ${EXTERNAL_CONNECT_TIMEOUT_MS:500}
  read-timeout-ms: ${EXTERNAL_READ_TIMEOUT_MS:1000}     # 0 이면 타임아웃 없음 (E8-0 무방비 실험용)

logging:
  level:
    root: INFO
    com.example.coupon: INFO
