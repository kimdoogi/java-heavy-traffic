# Redis Sentinel 설정 (E8 HA 실험, B). 컨테이너 시작 시 쓰기 가능한 곳으로 복사해 쓴다(sentinel이 런타임에 재작성).
port 26379
# Docker: 호스트명으로 monitor/announce — resolve+announce hostnames로 컨테이너 IP 함정(127.0.0.1 등) 회피.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
# primary = base compose의 redis 서비스. quorum 2 = sentinel 3개 중 2개 동의해야 "죽음" 확정 (실행 리더는 과반 2).
sentinel monitor mymaster redis 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
