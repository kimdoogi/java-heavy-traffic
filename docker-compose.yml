# 실험 환경 전체. 리소스 제한은 env 로 주입 (scripts/run-experiment.sh 가 프로파일 S/M/L 로 변환)
#   APP_CPUS / APP_MEM / APP_JAVA_OPTS : coupon-api 컨테이너 제한 + JVM 옵션
#   VT / POOL_SIZE / TOMCAT_MAX_THREADS / EXTERNAL_* : 앱 실험 변수
name: heavy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coupon
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-100}", "-c", "shared_buffers=256MB"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "${PG_CPUS:-1}", memory: "${PG_MEM:-1g}" }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "256m" }

  mock-external:
    build: ./mock-external
    image: heavy/mock-external:local
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      FAULT_MODE: ${FAULT_MODE:-normal}
      FAULT_DELAY_MS: ${FAULT_DELAY_MS:-300}
      FAULT_JITTER_MS: ${FAULT_JITTER_MS:-0}
      FAULT_FAIL_RATE: ${FAULT_FAIL_RATE:-0}
      FAULT_STATUS: ${FAULT_STATUS:-500}
      FAULT_HANG_SECONDS: ${FAULT_HANG_SECONDS:-300}
      FAULT_FLAP_PERIOD: ${FAULT_FLAP_PERIOD:-10}
      FAULT_MAX_HANGS: ${FAULT_MAX_HANGS:-2000}
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 3s
      timeout: 3s
      retries: 40
    deploy:
      resources:
        limits: { cpus: "${MOCK_CPUS:-1}", memory: "${MOCK_MEM:-1g}" }

  # 앱 → toxiproxy:18081 → mock-external:8081  (E8 네트워크 장애 주입. 기본 경로는 mock 직결)
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./monitoring/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["8474:8474", "18081:18081"]
    depends_on: [mock-external]

  coupon-api:
    build: ./coupon-api
    image: heavy/coupon-api:local
    environment:
      JAVA_TOOL_OPTIONS: ${APP_JAVA_OPTS:--Xmx512m -XX:+UseG1GC}
      VT: ${VT:-true}
      POOL_SIZE: ${POOL_SIZE:-20}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-10000}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-1000}
      POOL_CONN_TIMEOUT_MS: ${POOL_CONN_TIMEOUT_MS:-3000}
      ISSUE_STRATEGY: ${ISSUE_STRATEGY:-redis}
      OPTIMISTIC_MAX_RETRIES: ${OPTIMISTIC_MAX_RETRIES:-3}
      IDEMPOTENCY_LOCK_TTL_SECONDS: ${IDEMPOTENCY_LOCK_TTL_SECONDS:-30}
      IDEMPOTENCY_RESULT_TTL_SECONDS: ${IDEMPOTENCY_RESULT_TTL_SECONDS:-600}
      DB_HOST: postgres
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      EXTERNAL_BASE_URL: ${EXTERNAL_BASE_URL:-http://mock-external:8081}
      EXTERNAL_CONNECT_TIMEOUT_MS: ${EXTERNAL_CONNECT_TIMEOUT_MS:-500}
      EXTERNAL_READ_TIMEOUT_MS: ${EXTERNAL_READ_TIMEOUT_MS:-1000}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-external: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "${APP_CPUS:-1}", memory: "${APP_MEM:-1g}" }

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver      # k6 → Prometheus remote write
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  prom-data:
  grafana-data:
